name: Daily Quote Generator

on:
  schedule:
    - cron: "0 * * * *" # Hourly catch-up; generator skips existing Pacific-date files.
  workflow_dispatch:
    inputs:
      date:
        description: "Selected date (YYYY-MM-DD); blank uses today in Pacific time"
        required: false
        type: string
      regenerate:
        description: "Replace existing non-Thursday content"
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-quote
  cancel-in-progress: false

jobs:
  generate:
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate daily message
        env:
          TARGET_DATE: ${{ inputs.date }}
          REGENERATE: ${{ inputs.regenerate }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node .github/scripts/generate-daily-quote.mjs

      - name: Commit & push if changed
        id: commit
        run: |
          git add daily/*.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Add daily message"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
